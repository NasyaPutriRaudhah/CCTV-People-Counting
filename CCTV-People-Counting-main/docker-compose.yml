services:

  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: cctv_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cctv_counting
      POSTGRES_USER: ferbos
      POSTGRES_PASSWORD: cctv_ferbos_2024
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferbos -d cctv_counting"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cctv-net          # shared with grafana so they can talk

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: cctv_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true        # allows iframe embed without login
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true      # required for iframes in Flask page
      - GF_SERVER_ROOT_URL=http://0.0.0.0:3000
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/people.json
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cctv-net          # same network as postgres

  # ── CCTV App ─────────────────────────────────────────────────────────────────
  cctv_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cctv_app
    restart: unless-stopped

    runtime: nvidia
    environment:
      - DISPLAY=${DISPLAY:-}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=video,compute,utility,display

      # DB_HOST=localhost works because cctv_app uses network_mode: host
      # and postgres exposes port 5432 to the host
      - DB_HOST=localhost
      - DB_PORT=5432
      - DB_NAME=cctv_counting
      - DB_USER=ferbos
      - DB_PASSWORD=cctv_ferbos_2024

      - GRAFANA_PORT=3000

      - OPENCV_VIDEOIO_PRIORITY_GSTREAMER=1
      - PYTHONUNBUFFERED=1
      - LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu:/usr/local/cuda/lib64

    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /usr/lib/python3.10/dist-packages/tensorrt:/usr/lib/python3.10/dist-packages/tensorrt:ro

    # host mode: required for RTSP + Flask on :8080 + reaches postgres on localhost:5432
    network_mode: host

    depends_on:
      postgres:
        condition: service_healthy

    mem_limit: 6g
    shm_size: 1g

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"


volumes:
  postgres_data:
  grafana_data:

networks:
  cctv-net:
    driver: bridge
